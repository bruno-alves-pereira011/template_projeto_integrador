<!--
  TELA: Home pública (home-cliente.html) — página inicial do app, NÃO exige login.
  OBJETIVO: Diretório de categorias de serviço lidas da tabela 'categorias'.
  ELEMENTOS (ids usados pelo js/cliente.js):
  - #link-entrar (visitante) / #btn-sair (logado) e #saudacao no cabeçalho.
  - #busca-categoria filtra os cards; #lista-categorias recebe os cards do <template id="modelo-card-categoria">.
  - Cada card leva para 'profissionais.html?categoria=<slug>'.
  - Estados: #categorias-carregando, #categorias-erro (+ #btn-tentar-novamente) e #categorias-vazio.
  - Scripts no final: Supabase CDN -> js/supabase-config.js -> js/categorias.js -> js/cliente.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpMe - Início</title>

    <!-- Fontes (mesmas dos protótipos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Conectando as folhas de estilo (CSS) -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="painel">

    <!-- Barra lateral de navegação -->
    <aside class="sidebar">
        <a href="home-cliente.html" class="sidebar-logo">
            <span class="logo-icone">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            HelpMe
        </a>

        <nav class="sidebar-menu">
            <a href="home-cliente.html" class="menu-item ativo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Início
            </a>
        </nav>

        <!-- Visitante vê "Entrar"; quem tem sessão vê "Sair" (o js/cliente.js troca).
             "Entrar" começa visível para o login continuar acessível mesmo se o JS falhar. -->
        <a href="index.html" id="link-entrar" class="menu-item menu-sair">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Entrar
        </a>

        <button type="button" id="btn-sair" class="menu-item menu-sair" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair
        </button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="conteudo">
        <header class="conteudo-cabecalho">
            <div>
                <h1 id="saudacao">Encontre um profissional</h1>
                <p class="subtitulo">Qual serviço você precisa hoje?</p>
            </div>
        </header>

        <!-- Busca de categorias -->
        <div class="barra-busca">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <label for="busca-categoria" class="visualmente-oculto">Buscar serviço</label>
            <input type="search" id="busca-categoria" placeholder="Buscar serviço (ex: encanador, pintor...)">
        </div>

        <!-- Enquanto a consulta ao banco não termina -->
        <p id="categorias-carregando" class="subtitulo" role="status">Carregando serviços...</p>

        <!-- Os cards de categorias são inseridos aqui pelo js/cliente.js -->
        <section id="lista-categorias" class="grade-categorias" aria-label="Categorias de serviço"></section>

        <!-- Erro ao consultar o Supabase: mensagem amigável em vez de lista vazia -->
        <div id="categorias-erro" class="feed-vazio" role="alert" hidden>
            <div class="feed-vazio-icone">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
            </div>
            <h2>Não foi possível carregar os serviços</h2>
            <p>Verifique sua conexão com a internet e tente novamente.</p>
            <button type="button" id="btn-tentar-novamente" class="btn-secundario">Tentar novamente</button>
        </div>

        <!-- Estado vazio (aparece quando a busca não encontra nada) -->
        <div id="categorias-vazio" class="feed-vazio" hidden>
            <div class="feed-vazio-icone">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>
            <h2>Nenhum serviço encontrado</h2>
            <p>Tente buscar por outro nome, como "eletricista" ou "chaveiro".</p>
        </div>
    </main>

    <!-- Modelo de card (clonado pelo JS para cada categoria) -->
    <template id="modelo-card-categoria">
        <a class="card-categoria">
            <div class="card-topo">
                <span class="avatar-categoria"></span>
                <h2 class="card-categoria-nome"></h2>
            </div>

            <p class="card-categoria-descricao"></p>

            <span class="btn-solicitar">Ver profissionais</span>
        </a>
    </template>

    <!-- 1. Importa a biblioteca do Supabase oficial da internet -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Conecta as suas chaves do banco de dados -->
    <script src="js/supabase-config.js"></script>

    <!-- 3. Busca as categorias na tabela 'categorias' -->
    <script src="js/categorias.js"></script>

    <!-- 4. Roda a lógica da home -->
    <script src="js/cliente.js"></script>

</body>
</html>
