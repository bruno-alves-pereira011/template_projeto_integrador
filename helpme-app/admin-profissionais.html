<!--
  TELA: Profissionais (admin-profissionais.html) — US-019
  OBJETIVO: O admin encontra qualquer profissional (pendente, aprovado, suspenso, recusado) e abre o detalhe,
  onde aprova/recusa (US-015) ou suspende/reativa (US-019).
  REGRAS: exigirSessao('admin'). Dados de rpc('profissionais_admin', {p_status, p_busca, p_limite, p_deslocamento}),
  de 50 em 50. ?status= abre a lista já filtrada (links do painel).
  ELEMENTOS (ids usados pelo js/telas/admin-profissionais.js):
  - #form-filtros: #filtro-status, #filtro-busca, #btn-buscar. #lista-total.
  - #lista-carregando / #lista-erro (+ #lista-erro-texto, #btn-tentar-novamente) / #lista-vazia (+ #btn-limpar).
  - #lista-profissionais recebe os cards de <template id="modelo-card-profissional">. #btn-carregar-mais.
  - Scripts: Supabase CDN -> js/servicos/supabase-config.js -> js/servicos/sessao.js -> js/servicos/admin-comum.js -> js/telas/admin-profissionais.js.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpMe - Profissionais</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="painel">

    <aside class="sidebar">
        <a href="admin.html" class="sidebar-logo">
            <span class="logo-icone">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            HelpMe <span class="selo-admin">Admin</span>
        </a>

        <nav class="sidebar-menu" aria-label="Área administrativa">
            <a href="admin.html" class="menu-item">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                Painel
            </a>
            <a href="admin-analise.html" class="menu-item">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
                Fila de análise
            </a>
            <a href="admin-profissionais.html" class="menu-item ativo" aria-current="page">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Profissionais
            </a>
            <a href="admin-contratacoes.html" class="menu-item">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
                Contratações
            </a>
            <a href="admin-categorias.html" class="menu-item">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Categorias
            </a>
        </nav>

        <button type="button" id="btn-sair" class="menu-item menu-sair">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Sair
        </button>
    </aside>

    <main class="conteudo">
        <header class="conteudo-cabecalho">
            <div>
                <h1>Profissionais</h1>
                <p id="lista-total" class="subtitulo" role="status">Todos os profissionais cadastrados.</p>
            </div>
        </header>

        <form id="form-filtros" class="barra-fila" role="search">
            <div class="filtro-fila">
                <label for="filtro-status">Status</label>
                <select id="filtro-status">
                    <option value="">Todos</option>
                    <option value="aprovado">Aprovados</option>
                    <option value="pendente">Pendentes</option>
                    <option value="suspenso">Suspensos</option>
                    <option value="recusado">Recusados</option>
                </select>
            </div>
            <div class="filtro-fila filtro-busca">
                <label for="filtro-busca">Nome</label>
                <input type="search" id="filtro-busca" maxlength="80" autocomplete="off" placeholder="Parte do nome">
            </div>
            <button type="submit" id="btn-buscar" class="btn btn-primario">Buscar</button>
        </form>

        <p id="lista-carregando" class="subtitulo" role="status">Carregando...</p>

        <div id="lista-erro" class="feed-vazio" role="alert" hidden>
            <h2>Não foi possível carregar a lista</h2>
            <p id="lista-erro-texto">Verifique sua conexão com a internet e tente novamente.</p>
            <button type="button" id="btn-tentar-novamente" class="btn-secundario">Tentar novamente</button>
        </div>

        <div id="lista-vazia" class="feed-vazio" hidden>
            <h2>Nenhum profissional encontrado</h2>
            <p>Mude o status ou o nome buscado.</p>
            <button type="button" id="btn-limpar" class="btn-secundario">Limpar filtros</button>
        </div>

        <section id="lista-profissionais" class="lista-fila" aria-label="Profissionais encontrados"></section>

        <button type="button" id="btn-carregar-mais" class="btn-secundario btn-carregar-mais" hidden>Carregar mais</button>
    </main>

    <!-- Card de um profissional (clonado pelo JS) -->
    <template id="modelo-card-profissional">
        <article class="card-fila">
            <div class="card-fila-topo">
                <h2 class="card-prof-nome"></h2>
                <span class="selo-status-admin card-prof-status"></span>
            </div>
            <p class="card-fila-local"></p>
            <p class="card-fila-categorias"></p>
            <p class="card-prof-desde"></p>
            <a class="btn-link-admin card-prof-detalhe">Ver detalhes</a>
        </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/servicos/supabase-config.js"></script>
    <script src="js/servicos/sessao.js"></script>
    <script src="js/servicos/admin-comum.js"></script>
    <script src="js/telas/admin-profissionais.js"></script>

</body>
</html>
